# InjazEdu AI — rate-limit zones (installed as /etc/nginx/conf.d/injazedu-ai-limits.conf by
# scripts/prod/sudo/02-nginx-certbot.sh). A zone only defines shared memory: it limits nothing
# until a server block names it, and only the two injazedu-ai sites do, so the other sites on this
# host are unaffected.
limit_req_zone $binary_remote_addr zone=injazedu_ai_control:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=injazedu_ai_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=injazedu_ai_api:10m rate=2r/s;
