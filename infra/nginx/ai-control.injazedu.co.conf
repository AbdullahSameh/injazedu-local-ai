# The control panel (installed as /etc/nginx/sites-available/ai-control.injazedu.co by
# scripts/prod/sudo/02-nginx-certbot.sh). Plain HTTP as written: `certbot --nginx --redirect
# --hsts` then adds the TLS listener, the certificate, the HTTP->HTTPS redirect and HSTS to this
# file, the same way the host's other sites were set up.
#
# Every X-Forwarded-* header the panel trusts is set here, overwriting whatever the client sent:
# Laravel believes these headers from this proxy only (TRUSTED_PROXIES, config/trustedproxy.php).
server {
    listen 80;
    listen [::]:80;
    server_name ai-control.injazedu.co;

    server_tokens off;
    client_max_body_size 2m;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The panel lives under /admin; the root page is Laravel's stock welcome.
    location = / {
        return 302 /admin;
    }

    location = /admin/login {
        limit_req zone=injazedu_ai_login burst=10 nodelay;

        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        # The Live Attention Queue polls every 15 s; a few operators stay far below this.
        limit_req zone=injazedu_ai_control burst=40 nodelay;

        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
