# The API's public name (installed as /etc/nginx/sites-available/ai.injazedu.co by
# scripts/prod/sudo/02-nginx-certbot.sh). It exposes exactly one route: GET /health/live, which
# touches nothing and says nothing. Everything else is 404 here — /health (which names the bot,
# chats and versions), /docs, /openapi.json and /v1/* stay reachable only from the host itself, on
# 127.0.0.1:18000. Nothing outside calls this API today (Telegram is polled; the panel reads
# Postgres); open another route only for a real integration, with authentication in front of it.
# `certbot --nginx --redirect --hsts` adds TLS, the redirect and HSTS to this file.
server {
    listen 80;
    listen [::]:80;
    server_name ai.injazedu.co;

    server_tokens off;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /health/live {
        limit_req zone=injazedu_ai_api burst=10 nodelay;
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:18000/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
