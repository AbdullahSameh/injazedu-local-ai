name: injazedu-local-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AI_MIGRATOR_PASSWORD: ${AI_MIGRATOR_PASSWORD}
      AI_APP_PASSWORD: ${AI_APP_PASSWORD}
      AI_CONTROL_PASSWORD: ${AI_CONTROL_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    mem_limit: 1500m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-api:
    build: ../apps/ai-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      API_PORT: ${API_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      WORKER_HEARTBEAT_INTERVAL_S: ${WORKER_HEARTBEAT_INTERVAL_S}
      WORKER_HEARTBEAT_TTL_S: ${WORKER_HEARTBEAT_TTL_S}
      # The /health block's telegram_ingestion component reads these directly (D-TG-31) — without
      # this passthrough it would report "credential absent" regardless of .env (a real gap found
      # and fixed at T084: this container never received TELEGRAM_BOT_TOKEN before).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL}
      TELEGRAM_ALLOWED_UPDATES: ${TELEGRAM_ALLOWED_UPDATES}
    ports:
      - "${API_PORT}:8000"
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-worker:
    build: ../apps/ai-api
    command: ["dramatiq", "app.workers.main", "--processes", "${WORKER_PROCESSES}", "--threads", "${WORKER_THREADS}"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      WORKER_HEARTBEAT_INTERVAL_S: ${WORKER_HEARTBEAT_INTERVAL_S}
      WORKER_HEARTBEAT_TTL_S: ${WORKER_HEARTBEAT_TTL_S}
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-telegram:
    build: ../apps/ai-api
    command: ["python", "-m", "app.telegram_main"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL}
      TELEGRAM_ALLOWED_UPDATES: ${TELEGRAM_ALLOWED_UPDATES}
      TELEGRAM_POLL_TIMEOUT_S: ${TELEGRAM_POLL_TIMEOUT_S}
      TELEGRAM_POLL_LIMIT: ${TELEGRAM_POLL_LIMIT}
      TELEGRAM_CONFLICT_STANDDOWN_COUNT: ${TELEGRAM_CONFLICT_STANDDOWN_COUNT}
      MODERATION_BURST_GAP_S: ${MODERATION_BURST_GAP_S}
      MODERATION_ITEM_MAX_AGE_S: ${MODERATION_ITEM_MAX_AGE_S}
      MODERATION_TEXT_RETENTION_DAYS: ${MODERATION_TEXT_RETENTION_DAYS}
      MODERATION_GAP_MIN_SILENCE_S: ${MODERATION_GAP_MIN_SILENCE_S}
      MODERATION_STALL_RESYNC_S: ${MODERATION_STALL_RESYNC_S}
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-control:
    build: ../apps/ai-control
    environment:
      APP_NAME: "InjazEdu AI Control Center"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:${CONTROL_PORT}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ai_control
      DB_PASSWORD: ${AI_CONTROL_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MODERATION_PERCENTILE_MIN_SAMPLES: ${MODERATION_PERCENTILE_MIN_SAMPLES}
    ports:
      - "${CONTROL_PORT}:8080"
    mem_limit: 640m
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build: ../apps/ai-api
    profiles: ["tools"]
    environment:
      MIGRATOR_DATABASE_URL: ${MIGRATOR_DATABASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # tg-doctor runs in this container and reads these directly (FR-036) — without this
      # passthrough it would report "credential absent" regardless of .env.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL}
      TELEGRAM_ALLOWED_UPDATES: ${TELEGRAM_ALLOWED_UPDATES}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    profiles: ["automation"]
    mem_limit: 768m
    depends_on:
      - postgres

volumes:
  postgres-data:
