# Production override for the Contabo VPS (docs/runbooks/production-deployment.md). Development
# never reads this file. Always used on top of the base file, through scripts/prod/dc:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --env-file .env …
#
# What it changes against the base file:
#   - Nothing is published except ai-api, ai-control and Postgres, and those on 127.0.0.1 only:
#     Docker's published ports bypass ufw, so a 0.0.0.0 publish would reach the internet. Postgres
#     is there for a database client over an SSH tunnel.
#   - Restart policies, bounded json-file logs, memory limits, pinned images.
#   - Redis keeps its queue on disk (AOF); the panel keeps its storage across deploys.
#   - Ollama runs here as a container. Model calls go to model_profiles.base_url — data, set by
#     scripts/prod/set-model-endpoint.sh — so moving inference to another host is a data change.
#   - The panel runs its production image (Dockerfile.prod) and trusts one proxy: the network
#     gateway, which is where the host nginx's connections to the published ports arrive from.
#   - Postgres initialises without the test database.
# `!reset` / `!override` replace the base file's lists instead of appending to them.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    # Loopback only, for a database client over SSH (runbook §7, "Connecting a database
    # client"): a fixed address that survives the container being recreated, never the internet.
    ports: !override
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
      # 00 and 01 only: production has no injaz_ai_test (02-test-database.sql is development's).
      - ./postgres/initdb/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
      - ./postgres/initdb/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7.4.11-alpine
    # The Dramatiq queues and delayed retries live here: append-only file on, and a full Redis
    # refuses writes rather than evicting queued work.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    ports: !reset []
    volumes:
      - redis-data:/data
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  # CPU inference on this host (research Finding 8: the runtime's context is
  # OLLAMA_CONTEXT_LENGTH, not the profile's num_ctx). One model loaded at a time, one request at
  # a time; CPU 0 is left to the host's other services. OLLAMA_MEM_LIMIT is raised only for the
  # separate E4B measurement (runbook §8).
  ollama:
    image: ollama/ollama:0.40.4
    environment:
      # llama.cpp sizes its thread pool from the host's cores and ignores the container's cpuset.
      # Measured here 2026-10-16: 6 threads on the 5 CPUs of OLLAMA_CPUSET generated 0.2 tokens/s;
      # 5 threads, 18.3 tokens/s. Keep OLLAMA_THREADS equal to the number of CPUs in OLLAMA_CPUSET.
      LLAMA_ARG_THREADS: ${OLLAMA_THREADS:-5}
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama-models:/root/.ollama
    cpuset: ${OLLAMA_CPUSET:-1-5}
    mem_limit: ${OLLAMA_MEM_LIMIT:-6500m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging

  ai-api:
    ports: !override
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  ai-worker:
    environment:
      # A remote inference host's Bearer key, read through a profile's api_key_env. Blank today.
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
    mem_limit: 768m
    restart: unless-stopped
    logging: *logging

  ai-classifier:
    environment:
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
    restart: unless-stopped
    logging: *logging

  ai-telegram:
    # on-failure, not unless-stopped: ai-telegram exits 0 on purpose — with no token, or after
    # standing down on repeated 409 conflicts, which requires an explicit restart (FR-004a).
    restart: on-failure
    logging: *logging

  ai-control:
    build:
      dockerfile: Dockerfile.prod
    environment:
      APP_URL: ${CONTROL_URL:-https://ai-control.injazedu.co}
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      SESSION_SECURE_COOKIE: "true"
      # The gateway pinned under `networks` below (config/trustedproxy.php).
      TRUSTED_PROXIES: 172.31.240.1
      # Never kept in the running container: the account is created by a one-off run that passes
      # both from the operator's shell (runbook §5).
      ADMIN_EMAIL: ""
      ADMIN_PASSWORD: ""
    ports: !override
      - "127.0.0.1:${CONTROL_HOST_PORT:-18080}:8080"
    volumes:
      - control-storage:/app/storage
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  migrate:
    environment:
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
    logging: *logging

networks:
  default:
    ipam:
      config:
        # Pinned so ai-control can trust exactly one proxy address (TRUSTED_PROXIES above). Checked
        # free on the host: Docker's own networks there are 172.17.0.0/16 and 172.18.0.0/16.
        - subnet: 172.31.240.0/24
          gateway: 172.31.240.1

volumes:
  redis-data:
  ollama-models:
  control-storage:
