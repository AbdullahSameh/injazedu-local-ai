; Production overrides on top of php.ini-production (Dockerfile.prod).
expose_php = Off
memory_limit = 256M
; The panel accepts no uploads.
upload_max_filesize = 2M
post_max_size = 2M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code is baked into the image and never changes inside a running container.
opcache.validate_timestamps = 0
