openapi: 3.1.0
info:
  title: InjazEdu Local AI — M0 Foundation API
  version: 0.1.0
  description: |
    The complete HTTP surface of milestone M0. Two concerns only: reporting the health of the
    local environment, and proving that background work is executed.

    There is no AI capability here. No endpoint calls a language model, reads a textbook, or
    contacts InjazEdu. Those arrive at M1, M2, and M6 respectively.

    The service binds to localhost only and requires no inbound network access.
servers:
  - url: http://localhost:8000
    description: Local development (the only deployment target in M0)

paths:
  /health/live:
    get:
      summary: Liveness — is this process running?
      description: |
        Touches no dependency and always answers 200 while the process is alive. This is the
        container healthcheck. A down database must never cause the API container to be
        restart-looped, which is why liveness is separate from readiness.
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { type: string, const: alive }
                  service: { type: string, example: ai-api }
                  version: { type: string, example: '0.1.0' }

  /health:
    get:
      summary: Readiness — the state of every component
      description: |
        Probes all four components concurrently, each with a 1 second timeout, and returns the
        complete per-component body **every time** — including when components are down
        (FR-007). Total response budget: under 2 seconds (SC-002).

        Status code maps the overall verdict: 200 when `ok`, 503 when `degraded` or `down`.
        The body shape is identical in both cases, so a reader never has to branch on the code
        to learn what failed.

        The **model runtime is informational** (FR-008): it may be `down` while the overall
        verdict remains `ok`. M0 makes no model calls, so an absent Ollama does not make the
        environment unusable.
      responses:
        '200':
          description: Overall status is `ok` — database, broker, and worker are all healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
              examples:
                allHealthy:
                  summary: Everything up
                  value:
                    status: ok
                    checked_at: '2026-09-02T18:40:11Z'
                    duration_ms: 44
                    components:
                      database: { status: ok, required: true, latency_ms: 6, detail: 'PostgreSQL 16.4, extension vector 0.8.0' }
                      broker: { status: ok, required: true, latency_ms: 2, detail: 'Redis 7.4.1' }
                      worker: { status: ok, required: true, latency_ms: 2, detail: '1 worker, heartbeat 3s ago' }
                      model_runtime: { status: ok, required: false, latency_ms: 31, detail: 'Ollama 0.33.2' }
                modelRuntimeDown:
                  summary: Ollama not running — still overall ok (FR-008)
                  value:
                    status: ok
                    checked_at: '2026-09-02T18:41:02Z'
                    duration_ms: 1052
                    components:
                      database: { status: ok, required: true, latency_ms: 5, detail: 'PostgreSQL 16.4, extension vector 0.8.0' }
                      broker: { status: ok, required: true, latency_ms: 2, detail: 'Redis 7.4.1' }
                      worker: { status: ok, required: true, latency_ms: 2, detail: '1 worker, heartbeat 1s ago' }
                      model_runtime: { status: down, required: false, latency_ms: 1000, detail: 'connection refused at host.docker.internal:11434' }
        '503':
          description: |
            A required component is unavailable. The body is complete and names exactly which
            one (SC-003) — the endpoint reports the failure, it does not fail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
              examples:
                databaseDown:
                  summary: Database stopped; every other component still reported
                  value:
                    status: down
                    checked_at: '2026-09-02T18:42:30Z'
                    duration_ms: 1013
                    components:
                      database: { status: down, required: true, latency_ms: 1000, detail: 'connection refused at postgres:5432' }
                      broker: { status: ok, required: true, latency_ms: 2, detail: 'Redis 7.4.1' }
                      worker: { status: ok, required: true, latency_ms: 3, detail: '1 worker, heartbeat 4s ago' }
                      model_runtime: { status: ok, required: false, latency_ms: 28, detail: 'Ollama 0.33.2' }
                vectorMissing:
                  summary: Database reachable but the vector capability is absent — never silently ignored
                  value:
                    status: down
                    checked_at: '2026-09-02T18:43:05Z'
                    duration_ms: 21
                    components:
                      database: { status: down, required: true, latency_ms: 7, detail: "extension 'vector' is not installed" }
                      broker: { status: ok, required: true, latency_ms: 2, detail: 'Redis 7.4.1' }
                      worker: { status: ok, required: true, latency_ms: 2, detail: '1 worker, heartbeat 2s ago' }
                      model_runtime: { status: ok, required: false, latency_ms: 25, detail: 'Ollama 0.33.2' }
                workerDown:
                  summary: No live heartbeat — the worker is not consuming
                  value:
                    status: down
                    checked_at: '2026-09-02T18:44:19Z'
                    duration_ms: 12
                    components:
                      database: { status: ok, required: true, latency_ms: 5, detail: 'PostgreSQL 16.4, extension vector 0.8.0' }
                      broker: { status: ok, required: true, latency_ms: 2, detail: 'Redis 7.4.1' }
                      worker: { status: down, required: true, latency_ms: 2, detail: 'no heartbeat within 15s' }
                      model_runtime: { status: ok, required: false, latency_ms: 27, detail: 'Ollama 0.33.2' }

  /v1/diagnostics/ping:
    post:
      summary: Enqueue the diagnostic background task
      description: |
        Returns immediately with a nonce; the task runs in the worker process, not here
        (FR-016). Set `should_fail` to exercise the failure path — the task raises, the failure
        and its reason are recorded, and the worker stays available for the next task (FR-018).

        If the broker is unreachable the call fails visibly with 503 rather than silently
        dropping the task.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                should_fail:
                  type: boolean
                  default: false
                  description: Make the task raise, so the recorded-failure path can be observed.
      responses:
        '202':
          description: Accepted and enqueued.
          content:
            application/json:
              schema:
                type: object
                required: [nonce, status]
                properties:
                  nonce: { type: string, format: uuid }
                  status: { type: string, const: pending }
        '503':
          description: The broker is unreachable — the task was not enqueued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/diagnostics/ping/{nonce}:
    get:
      summary: Read the outcome of a diagnostic task
      description: |
        `pending` means no result has been recorded yet. `completed` and `failed` are terminal;
        `failed` carries the exception type and message (FR-018). Results expire after 5 minutes.
      parameters:
        - name: nonce
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The current known state of that task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticResult' }
              examples:
                completed:
                  value:
                    nonce: 9f1c8a52-0c1e-4a3b-9f7d-2a6b1c4e5d80
                    status: completed
                    result: pong
                    finished_at: '2026-09-02T18:45:02Z'
                    worker: 'ai-worker:41'
                failed:
                  value:
                    nonce: 3b7e4d10-55aa-4c9e-8f21-77d3c9a10be4
                    status: failed
                    error_type: RuntimeError
                    error_message: 'diagnostic failure requested'
                    finished_at: '2026-09-02T18:45:40Z'
                    worker: 'ai-worker:41'
                pending:
                  summary: Enqueued, not yet executed (also what you see while no worker is running)
                  value:
                    nonce: 5c2a9e77-1d34-4b8a-90ff-6e0b2f8c1234
                    status: pending

components:
  schemas:
    ComponentStatus:
      type: object
      required: [status, required]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        required:
          type: boolean
          description: |
            Whether this component's state affects the overall verdict. False only for
            `model_runtime` in M0 (FR-008).
        latency_ms: { type: integer, minimum: 0 }
        detail:
          type: string
          description: Human-readable specifics — the version when healthy, the reason when not.
    HealthReport:
      type: object
      required: [status, checked_at, components]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
          description: |
            `ok` when every required component is ok. `degraded` when a required component is
            degraded but none are down. `down` when any required component is down.
        checked_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        components:
          type: object
          required: [database, broker, worker, model_runtime]
          description: All four are always present, whatever their state (SC-003).
          properties:
            database: { $ref: '#/components/schemas/ComponentStatus' }
            broker: { $ref: '#/components/schemas/ComponentStatus' }
            worker: { $ref: '#/components/schemas/ComponentStatus' }
            model_runtime: { $ref: '#/components/schemas/ComponentStatus' }
    DiagnosticResult:
      type: object
      required: [nonce, status]
      properties:
        nonce: { type: string, format: uuid }
        status: { type: string, enum: [pending, completed, failed] }
        result: { type: string }
        error_type: { type: string }
        error_message: { type: string }
        finished_at: { type: string, format: date-time }
        worker: { type: string, description: 'host:pid of the worker that ran it' }
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
